name: Encrypted Supabase backup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: studenthub-production-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.event_name == 'workflow_dispatch' || vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_BACKUP_SECRET_KEY: ${{ secrets.SUPABASE_BACKUP_SECRET_KEY }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install production dependencies
        run: pnpm install --frozen-lockfile --prod

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install encryption and S3 tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y age

          if command -v aws >/dev/null 2>&1; then
            echo "AWS CLI already installed."
          else
            sudo apt-get install -y unzip curl

            case "$(uname -m)" in
              x86_64)
                AWS_ARCH="x86_64"
                ;;
              aarch64|arm64)
                AWS_ARCH="aarch64"
                ;;
              *)
                echo "Unsupported architecture: $(uname -m)"
                exit 1
                ;;
            esac

            curl -fsSL \
              "https://awscli.amazonaws.com/awscli-exe-linux-${AWS_ARCH}.zip" \
              -o /tmp/awscliv2.zip

            rm -rf /tmp/aws
            unzip -q /tmp/awscliv2.zip -d /tmp

            sudo /tmp/aws/install
          fi

          age --version
          aws --version
          supabase --version

      - name: Export, encrypt, upload, and verify
        shell: bash
        run: bash scripts/backup/run.sh
