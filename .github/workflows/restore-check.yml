name: Isolated backup restore check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studenthub-isolated-restore
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Install age
        shell: bash
        run: |
          go install filippo.io/age/cmd/age@v1.2.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Restore existing encrypted R2 backup into isolated Supabase
        shell: bash
        run: bash scripts/backup/restore-check.sh
