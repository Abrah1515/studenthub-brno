<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#B88918">
  <meta name="robots" content="noindex">
  <title>StudentHub Brno – offline</title>
  <style>
    :root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#111827;font:16px system-ui,sans-serif}.card{width:min(480px,calc(100% - 32px));padding:28px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;text-align:center;box-shadow:0 18px 50px rgb(15 23 42/10%)}img{width:64px;height:64px;border-radius:13px}h1{margin:18px 0 8px;font-size:24px}p{margin:0 0 20px;color:#64748b;line-height:1.6}button{min-height:44px;padding:0 18px;border:0;border-radius:8px;background:#b88918;color:#111827;font:700 15px system-ui,sans-serif;cursor:pointer}button:hover{background:#a98537}button:focus-visible{outline:3px solid #805d0e;outline-offset:3px}@media(prefers-color-scheme:dark){body{background:#090d18;color:#f8fafc}.card{background:#111827;border-color:#273244}.card p{color:#94a3b8}button{background:#f2c94c;color:#090d18}button:hover{background:#ffd966}button:focus-visible{outline-color:#ffd966}}
  </style>
</head>
<body>
  <main class="card">
    <img src="/brand/brno/icon-192.png" alt="">
    <h1>Teď jste offline</h1>
    <p>Základní obrazovka je dostupná, ale aktuální termíny, mapa, přihlášení a odesílání formulářů vyžadují připojení. Po obnovení sítě načteme vždy čerstvou verzi.</p>
    <button type="button" onclick="location.reload()">Zkusit znovu</button>
  </main>
</body>
</html>
