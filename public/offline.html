<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#4F46E5">
  <meta name="robots" content="noindex">
  <title>StudentHub Brno – offline</title>
  <style>
    :root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a;font:16px system-ui,sans-serif}.card{width:min(480px,calc(100% - 32px));padding:28px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;text-align:center;box-shadow:0 12px 32px rgb(15 23 42/9%)}img{width:64px;height:64px;border-radius:8px}h1{margin:18px 0 8px;font-size:24px}p{margin:0 0 20px;color:#64748b;line-height:1.6}button{min-height:44px;padding:0 18px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font:700 15px system-ui,sans-serif;cursor:pointer}button:hover{background:#4338ca}button:focus-visible{outline:3px solid #4f46e5;outline-offset:3px}@media(prefers-color-scheme:dark){body{background:#0f172a;color:#f8fafc}.card{background:#111827;border-color:#273244}.card p{color:#cbd5e1}button{background:#818cf8;color:#020617}button:hover{background:#a5b4fc}button:focus-visible{outline-color:#818cf8}}
  </style>
</head>
<body>
  <main class="card">
    <img src="/brand/brno/studenthub-icon-v2-192.png" alt="">
    <h1>Teď jste offline</h1>
    <p>Základní obrazovka je dostupná, ale aktuální termíny, mapa, přihlášení a odesílání formulářů vyžadují připojení. Po obnovení sítě načteme vždy čerstvou verzi.</p>
    <button type="button" onclick="location.reload()">Zkusit znovu</button>
  </main>
</body>
</html>
